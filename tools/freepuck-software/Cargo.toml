[package]
name = "freepuck-software"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
btleplug = "0.11"
clap = { version = "4.6.2", features = ["derive"] }
env_logger = "0.11.11"
futures = "0.3.32"
log = "0.4.33"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "signal"] }
uuid = "1.24.0"

[target."cfg(windows)".dependencies]
vigem-client = { version = "0.1.4", features = ["unstable_ds4", "unstable_xtarget_notification"] }

[target.'cfg(target_os = "linux")'.dependencies]
uinput = "0.1.3"
