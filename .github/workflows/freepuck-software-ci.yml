name: freepuck-software CI

on:
  push:
    branches:
      - main
    paths:
      - 'tools/freepuck-software/**'
      - '.github/workflows/freepuck-software-ci.yml'
  pull_request:
    paths:
      - 'tools/freepuck-software/**'
      - '.github/workflows/freepuck-software-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            tools/freepuck-software/target
          key: ${{ runner.os }}-freepuck-software-${{ hashFiles('tools/freepuck-software/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-freepuck-software-

      - name: Install BLE/uinput build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Build
        working-directory: tools/freepuck-software
        run: cargo build --target x86_64-unknown-linux-gnu --verbose

      - name: Test
        working-directory: tools/freepuck-software
        run: cargo test --target x86_64-unknown-linux-gnu --verbose

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Windows MSVC Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry\index
            ~\.cargo\registry\cache
            ~\.cargo\git\db
            tools/freepuck-software/target
          key: ${{ runner.os }}-freepuck-software-${{ hashFiles('tools/freepuck-software/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-freepuck-software-

      - name: Build
        working-directory: tools/freepuck-software
        shell: pwsh
        run: cargo build --target x86_64-pc-windows-msvc --verbose

      - name: Test
        working-directory: tools/freepuck-software
        shell: pwsh
        run: cargo test --target x86_64-pc-windows-msvc --verbose
