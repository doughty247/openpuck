[package]
name = "openpuck"
version = "0.0.1"
edition = "2021"

[features]
default = ["ble"]
ble = []
trace-haptics = []

[dependencies]
log = "0.4"
# Steam Controller 2 protocol codec and GATT command builders, shared with
# tools/freepuck-software. no_std, no dependencies of its own (core only).
steam-protocol = { path = "crates/steam-protocol" }

[target.xtensa-esp32s3-none-elf.dependencies]
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32s3", "log-04", "uart", "critical-section"] }
esp-alloc = "0.10.0"
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
static_cell = { version = "2.1.0" }
critical-section = "1.2.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

# USB dependencies
embassy-usb = "0.6.0"
usbd-hid = "0.8.2"

# Bluetooth dependencies
esp-radio = { version = "0.18.0", features = ["ble", "unstable", "esp32s3"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3"] }
trouble-host = { version = "0.6.0", features = ["default-packet-pool-mtu-255", "central", "gatt", "scan", "security"] }
embassy-sync = "0.6.0"
bt-hci = "0.8.0"
embedded-io = "0.6.1"
embassy-futures = "0.1.1"

# Flash storage for MAC address persistence
esp-storage = { version = "0.4.0", features = ["esp32s3"] }
rand_core = { version = "0.6", default-features = false }


[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
